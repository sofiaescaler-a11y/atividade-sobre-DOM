<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex7</title>

    <script>
        
        function nomear(){
            var input = document.querySelector("#texto")
            var p = document.querySelector("p")

            var qnt = input.value.length
            p.innerText = qnt


        }
        
    </script>
</head>
<body>
    <p>caracter</p>
    <button onclick="nomear()">Mudar o nome</button>
    <input id="texto" type="text">

</body>
</html>
