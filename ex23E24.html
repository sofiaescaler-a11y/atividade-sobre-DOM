<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex23 e 24</title>
    <script>
        
        function mudarTamanho() {
            var div = document.querySelector("div")   
            div.style.backgroundColor= "violet"
        }
        function voltar(){
            var div = document.querySelector("div")
            div.style.backgroundColor= "red" 
        }
    </script>

    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div onmouseover="mudarTamanho()" ></div>
    <div onmouseover="voltar()" ></div>

</body>
</html>
