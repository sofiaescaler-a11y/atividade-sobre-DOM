<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex14</title>
    <script>
        
        function mudarTamanho() {

            var div = document.querySelector("div")
            
            div.style.width = "600px"
            div.style.height = "600px"
        }
    </script>

    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div></div>
    <button onclick="mudarTamanho()">Mudar Cor da pagina</button>
</body>
</html>
