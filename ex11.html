<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex11</title>
    <script>
        function mudarCor() {
            var body = document.querySelector("body")
            var input = document.querySelector("#cor")

            var cor = input.value

            body.style.backgroundColor = cor
        }
    </script>
</head>
<body>
    <img id="imagem" />
    <input id="cor" type="color" />
    <button onclick="mudarCor()">Mudar Cor da pagina</button>
</body>
</html>
