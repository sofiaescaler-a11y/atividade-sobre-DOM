<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex35</title>

    <script>

        var qnt = 100
        
        function nomear(){
            var p = document.querySelector("p")

            qnt = qnt - 1

            p.innerText = qnt 
        }
        
    </script>
</head>
<body>
    <p>100</p>
    <button onclick="nomear()">Mudar o nome</button>
 

</body>
</html>
