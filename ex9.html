        function adicionar(){
            var item1 = document.querySelector("#item1")
            item1.innerHTML = "AAAAAAA"
        }
    </script>

    <ul id="item1">aaaaa</ul>
    <ul id="item2">bbbbb</ul>
    <ul id="item3">ccccc</ul>

    <button onclick="adicionar()">Adicionar</button>
</body>
