<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex19</title>
    <script>
        function mudarCor() {
            var div = document.querySelector("div")
            div.style.backgroundColor = "violet"
        }
    </script>

    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div></div>
    <button onclick="mudarCor()">Mudar Cor da pagina</button>
</body>
