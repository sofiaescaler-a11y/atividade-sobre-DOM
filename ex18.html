<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex18</title>
    <script>
        function mudarCor() {
            var p = document.querySelector("p") 
            p.style.fontStyle = "italic"
        }
    </script>
</head>
<body>
    <p>Texto</p>
    <button onclick="mudarCor()">Mudar Cor da pagina</button>
</body>
</html>
