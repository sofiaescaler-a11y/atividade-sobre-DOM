<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex31</title>
    <script>
        
        function descobrir(){
            var p = document.querySelector("p")
            p.style.display = "block"
        }
    </script>
</head>
<body>
    <style>
        p{
            display: none
        }
    </style>
    <p>mensagem subliminar</p>
    <button onclick="descobrir()">clique para ver a mensagem</button>
</body>
</html>
